<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2Active</title>
  </head>
  <body>
    <div id="app" class="min-h-dvh w-dvw bg-navy-blue">

      <header class="flex items-center justify-between gap-2.5 lg:gap-5 border-b border-grey py-4 fixed bottom-0 lg:top-0 lg:bottom-auto left-0 lg:left-75 right-0 pl-2.5 pr-3 lg:px-7 backdrop-blur-xl text-white h-fit ">
          <button id="open-aside-btn" class="border-0 lg:hidden"><svg class="fill-current text-pink size-6.5" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>menu-rounded</title><path fill="currentColor" d="M4 18q-.425 0-.712-.288T3 17t.288-.712T4 16h16q.425 0 .713.288T21 17t-.288.713T20 18zm0-5q-.425 0-.712-.288T3 12t.288-.712T4 11h16q.425 0 .713.288T21 12t-.288.713T20 13zm0-5q-.425 0-.712-.288T3 7t.288-.712T4 6h16q.425 0 .713.288T21 7t-.288.713T20 8z"/></svg></button>

          <form id="search-form" class="search-form flex-1 flex items-center bg-light-navy-blue border border-grey focus-within:border-pink pl-4 rounded-lg" >
            <button class="cursor-pointer">
              <svg class="fill-current text-pink h-4.5 w-4.5" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>magnifier-outline</title> <path fill="currentColor" fill-rule="evenodd" d="M11.5 2.75C6.66751 2.75 2.75 6.66751 2.75 11.5C2.75 16.3325 6.66751 20.25 11.5 20.25C16.3325 20.25 20.25 16.3325 20.25 11.5C20.25 6.66751 16.3325 2.75 11.5 2.75ZM1.25 11.5C1.25 5.83908 5.83908 1.25 11.5 1.25C17.1609 1.25 21.75 5.83908 21.75 11.5C21.75 14.0605 20.8111 16.4017 19.2589 18.1982L22.5303 21.4697C22.8232 21.7626 22.8232 22.2374 22.5303 22.5303C22.2374 22.8232 21.7626 22.8232 21.4697 22.5303L18.1982 19.2589C16.4017 20.8111 14.0605 21.75 11.5 21.75C5.83908 21.75 1.25 17.1609 1.25 11.5Z" clip-rule="evenodd"/></svg>
            </button>
            <input class="px-4 py-2 text-base flex-1 outline-none" type="text" id="search-task-input" placeholder="Search tasks..."/>
          </form>

         <button id="change-mode-btn">
           <svg class="text-pink size-6" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"> <title>mode-light-bold</title><g fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4" stroke-linejoin="round" /><path stroke-linecap="round" d="M20 12h1M3 12h1m8 8v1m0-18v1m5.657 13.657l.707.707M5.636 5.636l.707.707m0 11.314l-.707.707M18.364 5.636l-.707.707"/></g></svg></button>
         </button>
      </header>

      <div id="asidebar-backdrop" class="fixed inset-0 z-30 bg-black/60 backdrop-blur-xs transition-opacity lg:hidden hidden"></div>
      <aside id="aside" class="fixed left-0 top-0 bottom-0 z-40 w-75 bg-navy-blue -translate-x-full lg:translate-x-0 transition-transform duration-400 flex justify-between flex-col text-white px-6 py-6 border-r border-grey ">
        <div class="space-y-9">
          <div class="flex items-center gap-2 justify-between h-14">
            <div class="border-3 border-pink rounded-sm py-1 px-1 flex items-center"> <svg class="fill-current text-pink h-7 w-7" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>check-solid</title> <path fill="currentColor" fill-rule="evenodd" d="M23.914 6.914L8.5 22.328L.086 13.914l2.828-2.828L8.5 16.672L21.086 4.086z" clip-rule="evenodd" /> </svg> </div>
            <p class="flex-1 text-pink text-3xl font-bold">
              2Active 
              <span class="text-white font-normal text-sm block">Small Steps. Big goals</span>
            </p>
            <button id="close-aside-btn"><svg class="size-6.5 lg:hidden fill-current text-pink" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title>close-outline-bold</title><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"><path d="m5 5 14 14"/><path d="M19 5 5 19"/></g></svg></button>
          </div>

          <ul class="flex flex-col justify-center gap-2 w-full pb-4 border-b border-grey" > <li class="tab active flex items-center gap-4 w-full py-2.5 px-3 rounded-[10px] cursor-pointer bg-light-pink hover:bg-light-pink" > <svg class="text-pink w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>category</title> <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5" d="M5 10h2q3 0 3-3V5q0-3-3-3H5Q2 2 2 5v2q0 3 3 3m12 0h2q3 0 3-3V5q0-3-3-3h-2q-3 0-3 3v2q0 3 3 3m0 12h2q3 0 3-3v-2q0-3-3-3h-2q-3 0-3 3v2q0 3 3 3M5 22h2q3 0 3-3v-2q0-3-3-3H5q-3 0-3 3v2q0 3 3 3" /> </svg>
              <p class="tab-title active flex-1 text-pink font-semibold">All Tasks</p>
              <p class="task-count px-3 py-1 rounded-full bg-light-navy-blue">0</p>
            </li>
            <li class="tab active flex items-center gap-4 w-full py-2.5 px-3 rounded-[10px] cursor-pointer hover:bg-light-pink" > <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>target</title> <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" > <path d="M16.243 16.243a6 6 0 1 1-8.485-8.485a6 6 0 0 1 8.485 8.485" /> <path d="M12 13.75a1.75 1.75 0 1 0 0-3.5a1.75 1.75 0 0 0 0 3.5" /> <path d="M22 12a10 10 0 1 1-20.001 0A10 10 0 0 1 22 12" /> </g> </svg>
              <p class="tab-title flex-1">Active</p>
              <p class="task-count px-3 py-1 rounded-full bg-light-navy-blue">0</p>
            </li> 
            <li class="tab active flex items-center gap-4 w-full py-2.5 px-3 rounded-[10px] cursor-pointer hover:bg-light-pink" > <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>check-o</title> <g fill="currentColor"> <path d="M10.243 16.314L6 12.07l1.414-1.414l2.829 2.828l5.656-5.657l1.415 1.415z" /> <path fill-rule="evenodd" d="M1 12C1 5.925 5.925 1 12 1s11 4.925 11 11s-4.925 11-11 11S1 18.075 1 12m11 9a9 9 0 1 1 0-18a9 9 0 0 1 0 18" clip-rule="evenodd" /> </g> </svg>
              <p class="tab-title flex-1">Completed</p>
              <p class="task-count px-3 py-1 rounded-full bg-light-navy-blue">0</p>
            </li>
          </ul>
        </div>

        <div class="flex flex-col gap-2 justify-center rounded-xl shadow-[0_0_5px] shadow-pink px-4 py-4"> 
          <svg class="w-14 h-14 fill-current text-pink" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>target-fill</title> <path fill="currentColor" d="M12 2a1 1 0 1 1 0 2a8 8 0 1 0 8 8a1 1 0 1 1 2 0c0 5.523-4.477 10-10 10S2 17.523 2 12S6.477 2 12 2m0 4a1 1 0 1 1 0 2a4 4 0 1 0 4 4a1 1 0 1 1 2 0a6 6 0 1 1-6-6m6.571-3.9a.5.5 0 0 1 .5.5v1.83a.5.5 0 0 0 .5.499H21.4a.5.5 0 0 1 .5.5v.915l-1.888 1.888a2 2 0 0 1-1.414.586h-2l-3.89 3.889a1 1 0 0 1-1.414-1.414l3.89-3.889v-2a2 2 0 0 1 .585-1.414l1.89-1.89z" /> </svg>
          <p class="font-semibold text-xl">Be a man / woman of your word</p>
          <p class="text-gray-300 text-sm">Hard choices easy life. Small steps everyday leads to big results.</p>
        </div>
      </aside>


      <main class="flex flex-col px-5 pt-5 lg:pt-22 pb-19 lg:pb-0 lg:pl-82 h-dvh">

        <div class="grid grid-cols-[auto_1fr_auto] gap-x-2 items-center" > <svg class="fill-current text-pink size-8.5 lg:size-15" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 36 36" > <title>tasks-solid</title> <path fill="currentColor" d="M29.29 4.95h-7.2a4.31 4.31 0 0 0-8.17 0H7a1.75 1.75 0 0 0-2 1.69v25.62a1.7 1.7 0 0 0 1.71 1.69h22.58A1.7 1.7 0 0 0 31 32.26V6.64a1.7 1.7 0 0 0-1.71-1.69m-18 3a1 1 0 0 1 1-1h3.44v-.63a2.31 2.31 0 0 1 4.63 0V7h3.44a1 1 0 0 1 1 1v1.8H11.25Zm14.52 9.23l-9.12 9.12l-5.24-5.24a1.4 1.4 0 0 1 2-2l3.26 3.26l7.14-7.14a1.4 1.4 0 1 1 2 2Z" class="clr-i-solid clr-i-solid-path-1" /> <path fill="none" d="M0 0h36v36H0z" /> </svg>
          <div>
            <p class="text-pink font-bold text-xl lg:text-2xl">My Tasks</p>
            <p class="text-gray-400 text-sm whitespace-nowrap">Organize your day, get things done!</p>
          </div>
          <button class="add-task-btn bg-pink py-2.5 px-3.5 sm:px-3.5 sm:py-2 flex items-center gap-2 sm:h-fit rounded-lg text-white sm:font-medium cursor-pointer" > <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" > <title>add-fill</title> <path fill="currentColor" fill-rule="evenodd" d="M12 3.5A1.5 1.5 0 0 1 13.5 5v5.5H19a1.5 1.5 0 0 1 0 3h-5.5V19a1.5 1.5 0 0 1-3 0v-5.5H5a1.5 1.5 0 0 1 0-3h5.5V5A1.5 1.5 0 0 1 12 3.5" clip-rule="evenodd" /> </svg>
            <span class="hidden sm:block">Add Task</span>
          </button>
        </div>

        <div id="tasks-container" class="flex-1 ">
          <p id="health-test-result" class="bg-blue-800/90 w-11/12 px-2.5 py-2 text-white rounded-lg text-center"></p>
        </div>
      </main>

    </div>
    <script type="module" src="/src/main.js" defer></script>
  </body>
</html>
